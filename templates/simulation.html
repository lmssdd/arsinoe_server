{% extends "base.html" %}

{% block title %}Simulation - ARSINOE{% endblock %}

{% block content %}
  <h1 class="title">Simulation</h1>
  
  <form id="uploadForm">
    <div class="field">
      <label class="label">Upload File</label>
      <div class="control">
        <input type="file" name="file" id="fileInput" class="input" required>
      </div>
      <p class="help">
        <a href="/static/files/scenarios.zip" download>Download a .zip file containing all climate scenario data</a>
      </p>
    </div>

    <div class="field">
      <label class="label">Select site</label>
      <div class="control">
        <label class="radio">
          <input type="radio" name="site" value="Ussana" checked>
          Ussana
        </label>
        <label class="radio">
          <input type="radio" name="site" value="Benatzu">
          Benatzu
        </label>
      </div>
    </div>

    <!-- Support irrigation (slider + number) -->
    <div class="field">
      <label class="label" for="irr-range">Support irrigation (%)</label>
      <div class="control" style="display:flex; gap:.75rem; align-items:center;">
        <input id="irr-range" class="slider is-fullwidth"
              type="range" min="0" max="100" step="1" value="0" style="flex:1;">
        <input id="irr-number" class="input" type="number"
              name="irr" min="0" max="100" step="1" value="0" style="width:6rem;">
      </div>
      <p class="help">0 = rainfed; 100 = maximum support.</p>
    </div>

    <div class="control">
      <button class="button is-primary" type="submit">Submit</button>
    </div>
  </form>

  <div id="plot" class="mt-5"></div>
  <div id="stats" class="mt-3"></div>
  <div id="downloadLink" class="mt-3"></div>

  <script>
    // sync slider with number
    const irrRange  = document.getElementById('irr-range');
    const irrNumber = document.getElementById('irr-number');
    const clamp = v => Math.max(0, Math.min(100, Number(v) || 0));
    function setIrr(v){ const val = clamp(v); irrRange.value = val; irrNumber.value = val; }
    irrRange.addEventListener('input',  () => setIrr(irrRange.value));
    irrNumber.addEventListener('input', () => setIrr(irrNumber.value));

    document.getElementById('uploadForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      showGlobalLoading("Running AquaCrop simulation...");

      try {
        const fileInput = document.getElementById('fileInput');
        const site = document.querySelector('input[name="site"]:checked')?.value || 'Ussana';
        const irr = clamp(irrNumber.value);

        const fd = new FormData();
        fd.append('file', fileInput.files[0]);
        fd.append('site', site);
        fd.append('irr', String(irr));  // <-- exact value sent

        const res = await fetch('/simulation', { method: 'POST', body: fd });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const result = await res.json();

        Plotly.newPlot('plot', result.plot.data, result.plot.layout);
        document.getElementById('stats').innerHTML = result.stats
        document.getElementById('downloadLink').innerHTML =
          `<a href="${result.download_url}" download="results.json" class="button is-info">Download Results as JSON</a>`;
      } catch (e) {
        console.error(e); alert(e.message || 'Failed.');
      } finally {
        hideGlobalLoading();
      }
    });
  </script>

{% endblock %}
