{% extends "base.html" %}

{% block title %}Simulation - ARSINOE{% endblock %}

{% block content %}
  <h1 class="title">Simulation</h1>
  
  <form id="uploadForm">
    <div class="field">
      <label class="label">Upload File</label>
      <div class="control">
        <input type="file" name="file" id="fileInput" class="input" required>
      </div>
      <p class="help">
        <a href="/static/files/Ussana_ERA5_Land_1950_2023.txt" download>Download an example file</a>
      </p>
    </div>

    <div class="field">
      <label class="label">Select site</label>
      <div class="control">
        <label class="radio">
          <input type="radio" name="site" value="Ussana" checked>
          Ussana
        </label>
        <label class="radio">
          <input type="radio" name="site" value="Benatzu">
          Benatzu
        </label>
      </div>
    </div>

    <div class="control">
      <button class="button is-primary" type="submit">Submit</button>
    </div>
  </form>
  
  <div id="loading" style="display: none;">
    <div class="weather-animation">
      <div class="sun"></div>
      <div class="raindrop"></div>
      <p>Please wait, calculating wheat yield...</p>
    </div>
  </div>
  
  <div id="plot" class="mt-5"></div>

  <style>
    .weather-animation {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      color: white;
      font-size: 1.2rem;
    }

    .sun {
      width: 50px;
      height: 50px;
      background-color: #ffdd57;
      border-radius: 50%;
      animation: sunRainCycle 3s linear infinite;
    }

    .raindrop {
      width: 10px;
      height: 20px;
      background-color: #00aaff;
      border-radius: 50% 50% 0 0;
      transform: translateY(-10px);
      opacity: 0;
      animation: rainDropCycle 3s linear infinite;
    }

    @keyframes sunRainCycle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0; transform: scale(0.5); }
    }

    @keyframes rainDropCycle {
      0%, 100% { opacity: 0; transform: translateY(-10px); }
      50% { opacity: 1; transform: translateY(10px); }
    }
  </style>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      
      const loadingElement = document.getElementById('loading');
      loadingElement.style.display = 'flex';

      const fileInput = document.getElementById('fileInput');
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      const site = document.querySelector('input[name="site"]:checked').value;
      formData.append('site', site);

      try {
        const response = await fetch('/simulation', {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        const plotData = await response.json();
        Plotly.newPlot('plot', plotData.data, plotData.layout);
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
      } finally {
        loadingElement.style.display = 'none';
      }
    });
  </script>
{% endblock %}
