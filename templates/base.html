<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ARSINOE Data Server{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  
  <style>
    /* Styling for plot container */
    .plot-container {
      text-align: center;
      width: 100%;
      margin: 0 auto;
    }
    #plot {
      width: 100%;
      height: 500px;
    }

    /* Hero Section Background */
    .hero.is-primary {
      background-image: url("https://arsinoe-project.eu/securstorage/2022/02/cs9-2.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      min-height: 40vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
      padding-top: 6rem;
    }

    /* Hero Content Styling */
    .hero-body {
      color: white;
      font-family: 'Arial', sans-serif;
      text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .hero .title {
      font-size: 3rem;
      font-weight: bold;
      color: white;
    }

    .hero .subtitle {
      font-size: 2rem;
      color: white;
    }

    /* Adjust Navbar Content */
    .navbar .navbar-item img {
      max-height: 3rem;
    }
  </style>

</head>

<body>

  {% include "navbar.html" %}

  <section class="hero is-primary">
    <div class="hero-body">
      <div class="container">
        <h1 class="title">
          CRS4 - Sardinian ARSINOE Test Case Archive Data
        </h1>
        <p class="subtitle">
          Service platform for ARSINOE data.
        </p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      {% block content %}
      {% endblock %}
    </div>
  </section>

  <div id="global-loading" style="display: none;">
    <div class="weather-animation">
      <div id="global-weather-icon">☀️</div>
      <p>Loading... Please wait</p>
    </div>
  </div>
  
  {% include "footer.html" %}

  <style>
    .weather-animation {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      color: white;
      font-size: 1.5rem;
      z-index: 9999;
    }
  
    #global-weather-icon {
      font-size: 4rem;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const burger = document.querySelector(".navbar-burger");
      const menu = document.querySelector(".navbar-menu");
      if (burger) {
        burger.addEventListener("click", () => {
          burger.classList.toggle("is-active");
          menu.classList.toggle("is-active");
        });
      }
    });

    function showGlobalLoading(message = "Loading... Please wait") {
      const loader = document.getElementById("global-loading");
      const icon = document.getElementById("global-weather-icon");
      loader.querySelector("p").textContent = message;
      loader.style.display = "flex";
      cycleGlobalWeatherIcons(icon);
    }

    function hideGlobalLoading() {
      document.getElementById("global-loading").style.display = "none";
    }

    function cycleGlobalWeatherIcons(iconElement) {
      const weatherIcons = ["☀️", "☁️", "🌧️", "🌤️", "🌦️", "🌨️"];
      let intervalId = setInterval(() => {
        const i = Math.floor(Math.random() * weatherIcons.length);
        iconElement.textContent = weatherIcons[i];
      }, 1000);

      // Store interval on the element so we can clear it if needed
      iconElement.dataset.intervalId = intervalId;
    }

  </script>

</body>
</html>
