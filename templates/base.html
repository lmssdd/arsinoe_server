<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ARSINOE Data Server{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  
  <style>
    /* Styling for plot container */
    .plot-container {
      text-align: center;
      width: 100%;
      margin: 0 auto;
    }
    #plot {
      width: 100%;
      height: 500px;
    }

    /* Hero Section Background */
    .hero.is-primary {
      background-image: url("https://arsinoe-project.eu/securstorage/2022/02/cs9-2.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      min-height: 40vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
      padding-top: 6rem;
    }

    /* Hero Content Styling */
    .hero-body {
      color: white;
      font-family: 'Arial', sans-serif;
      text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .hero .title {
      font-size: 3rem;
      font-weight: bold;
      color: white;
    }

    .hero .subtitle {
      font-size: 2rem;
      color: white;
    }

    /* Adjust Navbar Content */
    .navbar .navbar-item img {
      max-height: 3rem;
    }

    /* Loading Spinner */
    #loading {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent backdrop */
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lds-wheat {
      width: 80px;
      height: 80px;
      animation: grow 2s linear infinite; /* Adjust duration as needed */
    }

    .lds-wheat svg {
      width: 100%;
      height: 100%;
      fill: #00d1b2; /* Teal color for the wheat */
    }

    @keyframes grow {
      0% { transform: scale(0.5); opacity: 0.7; } /* Start small and slightly transparent */
      50% { transform: scale(1); opacity: 1; } /* Grow to full size and opaque */
      100% { transform: scale(0.5); opacity: 0.7; } /* Shrink back and slightly transparent */
    }

    #loading p {
      color: white;
      margin-top: 1rem;
      font-size: 1.2rem;
    }
  </style>

</head>

<body>

  {% include "navbar.html" %}

  <section class="hero is-primary">
    <div class="hero-body">
      <div class="container">
        <h1 class="title">
          CRS4 - Sardinian ARSINOE Test Case Archive Data
        </h1>
        <p class="subtitle">
          Service platform for ARSINOE data.
        </p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      {% block content %}
      {% endblock %}
    </div>
  </section>

  {% include "footer.html" %}

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const burger = document.querySelector(".navbar-burger");
      const menu = document.querySelector(".navbar-menu");
      if (burger) {
        burger.addEventListener("click", () => {
          burger.classList.toggle("is-active");
          menu.classList.toggle("is-active");
        });
      }
    });
  </script>

</body>
</html>
